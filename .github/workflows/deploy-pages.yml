name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e "const url = process.env.API_BASE_URL; if (!url || !url.startsWith('https://')) { throw new Error('Set the repository Actions variable API_BASE_URL to the Railway HTTPS URL first.'); } require('fs').writeFileSync('public/js/config.js', 'window.APP_CONFIG = ' + JSON.stringify({ apiBaseUrl: url }) + ';' + String.fromCharCode(10));"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
